[package]
name = "wallpapergpu-core"
version = "1.0.0"
edition = "2021"
authors = ["kerneldroid <https://github.com/kerneldroid/WallpaperGPU>"]
license = "GPL-3.0-or-later"
description = "Native Rust wgpu uniform bridge, .theme archive verifier, and smart static idle controller for WallpaperGPU on Android."
repository = "https://github.com/kerneldroid/WallpaperGPU"

[lib]
name = "wallpapergpu_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.18", features = ["derive"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
wgpu = { version = "22.1", default-features = false, features = ["wgsl", "vulkan", "gles"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
